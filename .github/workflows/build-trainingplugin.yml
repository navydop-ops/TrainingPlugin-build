name: Build TrainingPlugin

on:
  push:
    branches:
      - trainingplugin-linux-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Download BM218 SDK
        shell: pwsh
        run: |
          git clone https://github.com/bakkesmodorg/BakkesModSDK.git sdk
          git -C sdk checkout 479e8f571cf554b25f4eeb64d611dec4133edcaf

      - name: Build TrainingPlugin
        shell: pwsh
        run: |
          msbuild TrainingPlugin/TrainingPlugin.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:AdditionalIncludeDirectories="$env:GITHUB_WORKSPACE\sdk\include" `
            /p:AdditionalLibraryDirectories="$env:GITHUB_WORKSPACE\sdk\lib" `
            /p:AdditionalDependencies="pluginsdk.lib;%(AdditionalDependencies)"

      - name: Find built DLL
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter TrainingPlugin.dll -Recurse |
            Select-Object -ExpandProperty FullName

      - name: Upload TrainingPlugin.dll
        uses: actions/upload-artifact@v4
        with:
          name: TrainingPlugin
          path: |
            TrainingPlugin/x64/Release/TrainingPlugin.dll
            TrainingPlugin/Release/TrainingPlugin.dll
